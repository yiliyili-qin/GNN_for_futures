  <title>期货产业链图 · SMM 节点简化版</title>
  <style>
    :root { color-scheme: light; --ink: #18201c; --muted: #607068; --paper: #edf2ed; --panel: rgba(255,255,255,.95); --line: #d0d9d2; --accent: #b77a08; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; color: var(--ink); background: linear-gradient(rgba(30,53,41,.045) 1px,transparent 1px), linear-gradient(90deg,rgba(30,53,41,.045) 1px,transparent 1px), var(--paper); background-size: 24px 24px; }
    button { font: inherit; } #chart { width: 100%; height: 100%; }
    .title-block { position: fixed; z-index: 10; top: 18px; left: 22px; pointer-events: none; }
    h1 { margin: 0; font-family: "Microsoft JhengHei", "Noto Serif SC", serif; font-size: 24px; letter-spacing: 0; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .control-panel { position: fixed; z-index: 10; top: 16px; right: 16px; width: 268px; max-height: calc(100vh - 32px); overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: 0 7px 22px rgba(24,33,29,.1); backdrop-filter: blur(10px); }
    .panel-title { display: flex; justify-content: space-between; margin-bottom: 9px; font-size: 13px; font-weight: 700; }
    .panel-count, .relation-count { color: var(--muted); font-size: 11px; font-weight: 400; }
    .relation-list { display: grid; gap: 4px; }
    .relation-toggle { display: grid; grid-template-columns: 29px 1fr auto; align-items: center; gap: 7px; width: 100%; min-height: 29px; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; color: var(--ink); background: transparent; text-align: left; cursor: pointer; }
    .relation-toggle:hover { background: #f0f4f0; } .relation-toggle.off { color: #8a948f; opacity: .48; }
    .edge-sample { width: 27px; height: 0; border-top: 2px solid var(--edge-color); }
    .edge-sample.dashed { border-top-style: dashed; } .edge-sample.dotted { border-top-style: dotted; }
    .edge-sample.arrow::after { content: ""; display: block; width: 6px; height: 6px; margin: -4px 0 0 19px; border-top: 2px solid var(--edge-color); border-right: 2px solid var(--edge-color); transform: rotate(45deg); }
    .legend-note { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.55; }
    .smm-key { display: inline-block; width: 22px; margin-right: 7px; border-top: 3px dashed var(--accent); vertical-align: middle; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
    .panel-actions button { padding: 6px; border: 1px solid #c7d1c9; border-radius: 4px; color: #34413a; background: #fff; cursor: pointer; }
    .hint { position: fixed; z-index: 10; left: 22px; bottom: 18px; color: var(--muted); font-size: 12px; pointer-events: none; }
    @media (max-width: 760px) { .title-block { top: 12px; left: 14px; width: calc(100vw - 190px); } h1 { font-size: 17px; line-height: 1.35; } .subtitle { line-height: 1.5; } .control-panel { top: 10px; right: 10px; width: 166px; padding: 8px; } .relation-toggle { grid-template-columns: 22px 1fr auto; gap: 4px; padding: 3px; font-size: 10px; } .edge-sample { width: 20px; } .edge-sample.arrow::after { margin-left: 12px; } .hint { display: none; } }
  </style>

    const formatGrangerDirection = (source,target) => { const item=grangerByDirection.get(`${source}->${target}`); if(!item)return `<strong>${source} → ${target}</strong>：等待两年结果注册`; return `<strong>${source} → ${target}</strong>：总星分 ${item.total_star_points}<br>*** ${item.three_star_days} 天 · ** ${item.two_star_days} 天 · * ${item.one_star_days} 天<br>显著 ${item.significant_days}/${item.evaluation_days} 天 · 活跃 ${item.active_months} 月 · 显著跨度 ${item.significant_span_trading_days} 交易日<br>最长连续 ${item.longest_consecutive_significant_days} 天 · 10日集中度 ${(100*item.max_10d_star_concentration).toFixed(1)}% · 15日集中度 ${(100*item.max_15d_star_concentration).toFixed(1)}%`; };
    const edgeGrangerDetails = edge => `<br><br>${formatGrangerDirection(edge.source,edge.target)}<br><br>${formatGrangerDirection(edge.target,edge.source)}`;
    const makeLink = edge => { const relation=relationTypes[edge.relationType]; return {...edge,relation:relation.label,grangerDetails:edgeGrangerDetails(edge),symbol:relation.directed?['none','arrow']:['none','none'],symbolSize:relation.directed?[0,8]:[0,0],lineStyle:{color:relation.color,width:edge.relationType==='smm_mediated'?3:1.6,type:relation.type,opacity:edge.relationType==='market_linkage'?.65:.82,curveness:edge.relationType==='smm_mediated'?.13:.06}}; };
    const activeRelations = new Set(Object.keys(relationTypes));
    const chart = echarts.init(document.getElementById('chart'));
    const updateGraph = () => chart.setOption({
      animationDuration:900, animationEasingUpdate:'quinticInOut',
      tooltip:{confine:true,backgroundColor:'rgba(255,255,255,.98)',borderColor:'#c7d1c9',textStyle:{color:'#18201c',fontFamily:'Microsoft YaHei',fontSize:12},formatter(params){if(params.dataType==='edge'){const edge=params.data;const source=records.find(item=>item.code===edge.source);const target=records.find(item=>item.code===edge.target);const arrow=relationTypes[edge.relationType].directed?'→':'↔';const mediation=edge.smmPath?`<br><strong style="color:#9b6708">原 SMM 路径：${edge.smmPath}</strong>`:'';const evidence=edge.evidenceSourceUrl?`<br><br><strong>经济依据：</strong>${edge.economicRationale}<br><strong>来源：</strong><a href="${edge.evidenceSourceUrl}" target="_blank">${edge.evidenceSourceOrganization} · ${edge.evidenceSourceTitle}</a>`:'';return `<strong>${edge.relation}</strong><br>${source.name}（${source.code}） ${arrow} ${target.name}（${target.code}）${mediation}${evidence}${edge.grangerDetails}`;}const status=params.data.degree===0?'原图中仅连接 SMM 节点，收缩后无期货端点可连接':`关系度数：${params.data.degree}`;return `<strong>${params.data.name}</strong>（${params.data.code}）<br>${params.data.industry}<br>${params.data.exchange}<br><span style="color:#68766f">${status}</span>`;}},
      series:[{type:'graph',layout:'force',data:nodes,links:edgeRecords.filter(edge=>activeRelations.has(edge.relationType)).map(makeLink),categories,roam:true,zoom:.7,center:['42%','52%'],edgeSymbolSize:8,label:{show:true,formatter:params=>params.data.displayName,position:'inside',fontSize:9,fontWeight:600,lineHeight:12,overflow:'break',color:'#fff'},itemStyle:{borderColor:'rgba(255,255,255,.96)',borderWidth:2,shadowColor:'rgba(24,33,29,.14)',shadowBlur:7},emphasis:{focus:'adjacency',scale:1.18,label:{fontSize:10},lineStyle:{width:3.4,opacity:1}},force:{initLayout:'circular',repulsion:1050,gravity:.05,edgeLength:[100,205],friction:.58,layoutAnimation:true},lineStyle:{curveness:.06}}]
    },{notMerge:true});
    const relationList=document.getElementById('relation-list');
    const syncButtons=()=>document.querySelectorAll('.relation-toggle').forEach(button=>button.classList.toggle('off',!activeRelations.has(button.dataset.key)));
    Object.entries(relationTypes).forEach(([key,relation])=>{const count=edgeRecords.filter(edge=>edge.relationType===key).length;const button=document.createElement('button');button.type='button';button.dataset.key=key;button.className='relation-toggle';button.title=`显示或隐藏 ${relation.label}`;button.innerHTML=`<span class="edge-sample ${relation.type} ${relation.directed?'arrow':''}" style="--edge-color:${relation.color}"></span><span>${relation.label}</span><span class="relation-count">${count}</span>`;button.addEventListener('click',()=>{activeRelations.has(key)?activeRelations.delete(key):activeRelations.add(key);syncButtons();updateGraph();});relationList.appendChild(button);});
    document.getElementById('show-all').addEventListener('click',()=>{Object.keys(relationTypes).forEach(key=>activeRelations.add(key));syncButtons();updateGraph();});
    document.getElementById('smm-only').addEventListener('click',()=>{activeRelations.clear();activeRelations.add('smm_mediated');syncButtons();updateGraph();});
    document.getElementById('reset-view').addEventListener('click',()=>{Object.keys(relationTypes).forEach(key=>activeRelations.add(key));syncButtons();updateGraph();chart.dispatchAction({type:'restore'});});
    updateGraph(); window.addEventListener('resize',()=>chart.resize());
  </script>
</body>
</html>
